name: Windows 2025 Playwright reproduction

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Prepare Playwright runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP playwright-runtime
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Expand-Archive -LiteralPath task\输入数据包.zip -DestinationPath $runtime -Force
          Push-Location (Join-Path $runtime input_data)
          npm install --no-audit --no-fund
          npx playwright install chromium
          Pop-Location
          "PLAYWRIGHT_RUNTIME_INPUT=$(Join-Path $runtime input_data)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Audit four final attachments
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\ale-evidence | Out-Null
          node verification/windows_audit.mjs . | Tee-Object -FilePath $env:RUNNER_TEMP\ale-evidence\windows-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run complete Playwright reproduction
        shell: pwsh
        run: |
          node verification/run_reproduction.mjs . | Tee-Object -FilePath $env:RUNNER_TEMP\ale-evidence\windows-reproduction.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate Windows reference
        shell: pwsh
        run: |
          node verification/generate_reference.mjs .
          Compress-Archive -Path .windows-reference\output -DestinationPath $env:RUNNER_TEMP\ale-evidence\reference.zip -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-playwright-evidence
          path: ${{ runner.temp }}/ale-evidence/*
          if-no-files-found: error
